name: Atualizar painel de preventiva

on:
  push:
    paths:
      - "uploads/**"
      - "programacao/**"
      - "scripts/**"
      - "pcm/**"
  schedule:
    # de hora em hora, das 06h às 22h (horário de Brasília), para pegar a BASE_PCM nova do MTBF-MTTR
    - cron: "15 9-23,0-1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: painel-preventiva
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          ref: main          # sempre a versão mais nova (inclui o painel gerado pela execução anterior)

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas openpyxl pdfplumber

      - name: Localizar a BASE_PCM
        id: pcm
        run: |
          # 1º: cópia enviada pelo robô para pcm/ (chega na hora em que o arquivo é salvo)
          # 2º: se não houver, baixa do repositório MTBF-MTTR
          PCM=$(ls -t pcm/*.xls* 2>/dev/null | head -1 || true)
          if [ -z "$PCM" ]; then
            git clone --depth 1 https://github.com/geanfer10/MTBF-MTTR.git /tmp/mtbf
            PCM=$(ls -t /tmp/mtbf/uploads/*.xls* | head -1)
          fi
          echo "Usando: $PCM"
          echo "arquivo=$PCM" >> "$GITHUB_OUTPUT"
          NOVO=$(sha256sum "$PCM" | cut -d' ' -f1)
          ANTIGO=$(cat data/pcm.sha 2>/dev/null || true)
          echo "$NOVO" > data/pcm.sha
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$NOVO" = "$ANTIGO" ]; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
            echo "BASE_PCM sem alteração desde a última execução."
          else
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar o painel
        if: steps.pcm.outputs.mudou == 'sim'
        run: python scripts/build.py --pcm "${{ steps.pcm.outputs.arquivo }}"

      - name: Publicar
        if: steps.pcm.outputs.mudou == 'sim'
        run: |
          git config user.name "pcm-bot"
          git config user.email "pcm-bot@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza painel ($(TZ=America/Sao_Paulo date +'%d/%m %H:%M'))"
          git pull --rebase -X theirs   # se outra execução publicou antes, fica o painel recém-gerado
          git push
